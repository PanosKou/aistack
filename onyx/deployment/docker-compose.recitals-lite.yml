name: onyx
services:
  api_server:
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && echo "Starting Onyx Api Server" && uvicorn onyx.main:app
        --host 0.0.0.0 --port 8080
    depends_on:
      cache:
        condition: service_started
        required: false
      inference_model_server:
        condition: service_started
        required: false
      minio:
        condition: service_started
        required: false
      opensearch:
        condition: service_started
        required: false
      relational_db:
        condition: service_started
        required: true
    environment:
      AUTH_BACKEND: postgres
      AUTH_TYPE: basic
      CACHE_BACKEND: postgres
      CODE_INTERPRETER_BASE_URL: http://code-interpreter:8000
      COMPOSE_PROFILES: ""
      DISABLE_VECTOR_DB: "true"
      ENABLE_CRAFT: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      FILE_STORE_BACKEND: postgres
      IMAGE_TAG: v4.0.0
      INDEXING_MODEL_SERVER_HOST: indexing_model_server
      INTERNAL_URL: http://api_server:8080
      LOG_LEVEL: info
      LOG_ONYX_MODEL_INTERACTIONS: "False"
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
      MODEL_SERVER_HOST: inference_model_server
      OPENSEARCH_ADMIN_PASSWORD: StrongPassword123!
      OPENSEARCH_HOST: opensearch
      OUTPUTS_TEMPLATE_PATH: /app/onyx/server/features/build/sandbox/kubernetes/docker/templates/outputs
      PERSISTENT_DOCUMENT_STORAGE_PATH: /app/file-system
      POSTGRES_HOST: relational_db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      REDIS_HOST: cache
      S3_AWS_ACCESS_KEY_ID: minioadmin
      S3_AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_FILE_STORE_BUCKET_NAME: onyx-file-store-bucket
      USE_IAM_AUTH: "false"
      USER_AUTH_SECRET: ""
      VENV_TEMPLATE_PATH: /app/onyx/server/features/build/sandbox/kubernetes/docker/templates/venv
      WEB_TEMPLATE_PATH: /app/onyx/server/features/build/sandbox/kubernetes/docker/templates/outputs/web
    extra_hosts:
      - host.docker.internal=host-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health')
      timeout: 20s
      interval: 30s
      retries: 3
      start_period: 25s
    image: onyxdotapp/onyx-backend:v4.0.0
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      - default
      - ainet
    restart: unless-stopped
    volumes:
      - type: volume
        source: api_server_logs
        target: /var/log/onyx
        volume: {}
      - type: volume
        source: file-system
        target: /app/file-system
        volume: {}
  nginx:
    command:
      - /bin/sh
      - -c
      - rm -f /etc/nginx/conf.d/default.conf && cp -a /nginx-templates/. /etc/nginx/conf.d/
        && sed 's/r$$//' /etc/nginx/conf.d/run-nginx.sh > /tmp/run-nginx.sh && chmod
        +x /tmp/run-nginx.sh && /tmp/run-nginx.sh app.conf.template
    depends_on:
      api_server:
        condition: service_started
        required: true
      web_server:
        condition: service_started
        required: true
    environment:
      AUTH_TYPE: basic
      COMPOSE_PROFILES: ""
      DOMAIN: localhost
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      FILE_STORE_BACKEND: postgres
      IMAGE_TAG: v4.0.0
      INDEXING_MODEL_SERVER_HOST: indexing_model_server
      INTERNAL_URL: http://api_server:8080
      LOG_LEVEL: info
      LOG_ONYX_MODEL_INTERACTIONS: "False"
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
      MODEL_SERVER_HOST: inference_model_server
      NGINX_PROXY_CONNECT_TIMEOUT: "300"
      NGINX_PROXY_READ_TIMEOUT: "300"
      NGINX_PROXY_SEND_TIMEOUT: "300"
      POSTGRES_HOST: relational_db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      REDIS_HOST: cache
      S3_AWS_ACCESS_KEY_ID: minioadmin
      S3_AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_FILE_STORE_BUCKET_NAME: onyx-file-store-bucket
      USE_IAM_AUTH: "false"
      USER_AUTH_SECRET: ""
    image: nginx:1.25.5-alpine
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      - default
      - ainet
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
      - mode: ingress
        target: 80
        published: "3000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/pkoumantos/aistack/onyx/data/nginx
        target: /nginx-templates
        read_only: true
        bind: {}
  relational_db:
    command:
      - -c
      - max_connections=250
    environment:
      AUTH_TYPE: basic
      COMPOSE_PROFILES: ""
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      FILE_STORE_BACKEND: postgres
      IMAGE_TAG: v4.0.0
      INDEXING_MODEL_SERVER_HOST: indexing_model_server
      INTERNAL_URL: http://api_server:8080
      LOG_LEVEL: info
      LOG_ONYX_MODEL_INTERACTIONS: "False"
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
      MODEL_SERVER_HOST: inference_model_server
      POSTGRES_HOST: relational_db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      REDIS_HOST: cache
      S3_AWS_ACCESS_KEY_ID: minioadmin
      S3_AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_FILE_STORE_BUCKET_NAME: onyx-file-store-bucket
      USE_IAM_AUTH: "false"
      USER_AUTH_SECRET: ""
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      timeout: 5s
      interval: 10s
      retries: 5
    image: postgres:15.2-alpine
    networks:
      - default
      - ainet
    restart: unless-stopped
    shm_size: "1073741824"
    volumes:
      - type: volume
        source: db_volume
        target: /var/lib/postgresql/data
        volume: {}
  web_server:
    depends_on:
      api_server:
        condition: service_started
        required: true
    environment:
      AUTH_TYPE: basic
      COMPOSE_PROFILES: ""
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "false"
      FILE_STORE_BACKEND: postgres
      IMAGE_TAG: v4.0.0
      INDEXING_MODEL_SERVER_HOST: indexing_model_server
      INTERNAL_URL: http://api_server:8080
      LOG_LEVEL: info
      LOG_ONYX_MODEL_INTERACTIONS: "False"
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
      MODEL_SERVER_HOST: inference_model_server
      POSTGRES_HOST: relational_db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      REDIS_HOST: cache
      S3_AWS_ACCESS_KEY_ID: minioadmin
      S3_AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_FILE_STORE_BUCKET_NAME: onyx-file-store-bucket
      USE_IAM_AUTH: "false"
      USER_AUTH_SECRET: ""
    image: onyxdotapp/onyx-web-server:v4.0.0
    networks:
      - default
      - ainet
    restart: unless-stopped
networks:
  ainet:
    external: true
volumes:
  api_server_logs:
    name: onyx_api_server_logs
  db_volume:
    name: onyx_db_volume
  file-system:
    name: onyx_file-system
