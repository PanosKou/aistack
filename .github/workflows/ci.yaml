name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag-ci:
    name: RAG and MCP basic CI
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify expected files
        run: |
          set -euo pipefail

          test -f README.md
          test -f ollama/docker-compose.yaml
          test -f onyx/deployment/docker-compose.yml
          test -f onyx/deployment/docker-compose.recitals-lite.yml
          test -f onyx/deployment/docker-compose.network.yml
          test -f rag_stack/app/main.py
          test -f rag_stack/app/ingest.py
          test -f rag_stack/Dockerfile
          test -f rag_stack/docker-compose.yml
          test -f rag_stack/requirements.txt
          test -f rag_stack/mcp/server.py
          test -f rag_stack/mcp/Dockerfile
          test -f rag_stack/mcp/requirements.txt

          test ! -e rag_stack/sftpgo/config/sftpgo.db
          test -z "$(
            find rag_stack/sftpgo \
              -type f \
              ! -name .gitkeep \
              -print 2>/dev/null
          )"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          set -euo pipefail

          python -m py_compile \
            rag_stack/app/main.py \
            rag_stack/app/ingest.py \
            rag_stack/mcp/server.py

      - name: Validate Docker Compose config
        env:
          MCP_API_KEY: ci-mcp-key
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          QDRANT_API_KEY: ci-qdrant-key
          QDRANT_IMAGE_TAG: v1.18.1
          RAG_API_KEY: ci-rag-key
        run: |
          set -euo pipefail

          docker network create ainet 2>/dev/null || true
          docker compose -f rag_stack/docker-compose.yml config --quiet

      - name: Build Docker images
        run: |
          set -euo pipefail

          docker build \
            -t recitals-rag-api:ci \
            -f rag_stack/Dockerfile \
            rag_stack

          docker build \
            -t recitals-mcp:ci \
            -f rag_stack/mcp/Dockerfile \
            rag_stack/mcp

      - name: Start containers and run smoke checks
        env:
          MCP_API_KEY: ci-mcp-key
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          QDRANT_API_KEY: ci-qdrant-key
          QDRANT_IMAGE_TAG: v1.18.1
          RAG_API_KEY: ci-rag-key
        run: |
          set -euo pipefail

          docker network create ainet 2>/dev/null || true

          docker compose \
            -f rag_stack/docker-compose.yml \
            up -d --build --wait --wait-timeout 180 \
            qdrant rag-api mcp

          docker compose -f rag_stack/docker-compose.yml ps

          curl -fsS \
            -H "api-key: ${QDRANT_API_KEY}" \
            http://127.0.0.1:6333/healthz
          curl -fsS http://127.0.0.1:8010/health
          curl -fsS http://127.0.0.1:8010/ready
          curl -fsS http://127.0.0.1:8020/health

          test "$(
            curl -sS \
              -o /tmp/mcp-unauthorized.json \
              -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              http://127.0.0.1:8020/mcp
          )" = "401"

          curl -fsS \
            http://127.0.0.1:8020/mcp \
            -H "Authorization: Bearer ${MCP_API_KEY}" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/list' \
            -d '{
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/list",
              "params": {
                "_meta": {
                  "io.modelcontextprotocol/protocolVersion": "2026-07-28",
                  "io.modelcontextprotocol/clientCapabilities": {}
                }
              }
            }' |
            jq -e '.result.tools | any(.name == "ask_recitals")'

      - name: Dump logs on failure
        if: failure()
        env:
          MCP_API_KEY: ci-mcp-key
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          QDRANT_API_KEY: ci-qdrant-key
          QDRANT_IMAGE_TAG: v1.18.1
          RAG_API_KEY: ci-rag-key
        run: |
          docker compose \
            -f rag_stack/docker-compose.yml \
            logs --no-color || true

      - name: Cleanup
        if: always()
        env:
          MCP_API_KEY: ci-mcp-key
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          QDRANT_API_KEY: ci-qdrant-key
          QDRANT_IMAGE_TAG: v1.18.1
          RAG_API_KEY: ci-rag-key
        run: |
          docker compose \
            -f rag_stack/docker-compose.yml \
            down -v --remove-orphans || true
